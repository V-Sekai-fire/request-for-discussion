project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!README.md"
    - "!CLAUDE.md"
    - "!AGENTS.md"
    - "!BLOCKLIST.md"
    - "!KEYPOINTS.md"
    - "!PITFALLS.md"

website:
  site-url: https://weftspun.github.io/request-for-discussion
  repo-url: https://github.com/v-sekai-fabric/request-for-discussion
  repo-branch: main
  repo-actions: [edit, source]
  title: "Taskweft — Manuals"
  description: "Request-for-Discussion documents"
  page-navigation: true
  navbar:
    background: primary
    search: true
    left:
      - text: "Flight Levels"
        menu:
          - text: "L1 · Operations"
            file: pages/flight-level-1-operations.qmd
          - text: "L2 · Coordination"
            file: pages/flight-level-2-coordination.qmd
          - text: "L3 · Strategy"
            file: pages/flight-level-3-strategy.qmd
      - text: "Logbook"
        file: pages/logbook.qmd
      - text: "Register"
        file: pages/serials.md
  page-footer:
    right:
      - icon: github
        href: https://github.com/v-sekai-fabric/request-for-discussion

format:
  html:
    toc: true
    theme:
      light: [flatly, rfd-sheet.scss]
      dark: [darkly, rfd-sheet.scss]
    code-copy: true

freeze: true
