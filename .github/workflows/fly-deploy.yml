name: Deploy

# The site and the MCP endpoint redeploy when the corpus or the app changes.
# FLY_API_TOKEN is a repository secret; without it the job fails, which is the
# honest state rather than a green run that deployed nothing.
on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - "rfd/**"
      - "SERIALS*.exs"
      - "logbook/**"
      - "CLAUDE.md"
      - "BLOCKLIST.md"
      - "PITFALLS.md"
      - "KEYPOINTS.md"
      - "Containerfile"
      - "fly.toml"
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
