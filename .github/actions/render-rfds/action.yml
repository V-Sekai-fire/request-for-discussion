name: Render the RFD sources
description: >-
  Install the BEAM and render rfd/*.exs and SERIALS*.exs into the Markdown and
  .usda files the gates, render_site.py and Quarto read. Those files are build
  artifacts (RFD 2232), so every job that reads the tree renders first.
runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@v1
      with:
        otp-version: "27"
        elixir-version: "1.18"
    - run: mix rfd.render
      shell: bash
      working-directory: rfd_dsl
