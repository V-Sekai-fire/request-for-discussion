name: Render the RFD sources
description: >-
  Install the BEAM and render rfd/*.exs and SERIALS*.exs into the Markdown and
  .usda files the gates read. Those files are build
  artifacts (RFD 2232), so every job that reads the tree renders first.
runs:
  using: composite
  steps:
    - uses: erlef/setup-beam@v1
      with:
        otp-version: "29"
        elixir-version: "1.20.4"
    - run: mix local.hex --force && mix local.rebar --force && mix deps.get
      shell: bash
    - run: mix rfd.render
      shell: bash
